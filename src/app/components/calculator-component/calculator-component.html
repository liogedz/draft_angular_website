<body>

<div class="relative min-h-screen bg-linear-to-br from-purple-100 to-blue-200">

  <!-- Centered blurred card -->
  <div class="absolute inset-0 flex items-center justify-center">
    <div class="
        w-full sm:w-1/3
    mx-4 sm:mx-0
    bg-white/40 backdrop-blur-md
    rounded-2xl p-6
    shadow-lg border border-white/50
    space-y-2 sm:space-y-4 lg:space-y-6
      ">

      <div class="py-8 lg:py-16 px-4 mx-auto max-w-3xl">
        <h2 class="mb-4 text-4xl tracking-tight font-extrabold text-center text-gray-900">Service selection</h2>

        <div class="space-y-3">
          @for (service of services; track service.id; let i = $index) {
            <div
              class="flex items-center justify-between p-4 rounded-xl border transition-all duration-200 cursor-pointer"
              [class.border-blue-500]="formModel()[i]"
              [class.border-slate-200]="!formModel()[i]"
              [class.hover:border-blue-500]="!formModel()[i]"
              [ngClass]="{
    'bg-blue-50/50': formModel()[i],
    'hover:bg-blue-50/30': !formModel()[i]
  }"
            >
              <label class="flex items-center space-x-3 w-full cursor-pointer select-none">

                <input
                  type="checkbox" [formField]="calcForm[i]"
                  class="w-5 h-5 text-blue-600 border-slate-300 rounded focus:ring-blue-500 focus:ring-offset-2 accent-blue-600 transition duration-150"
                />
                <span class="font-medium text-slate-700">{{ service.name }}</span>
              </label>

              <span class="text-slate-500 font-semibold whitespace-nowrap">
          {{ service.price | currency:'EUR':'symbol':'1.0-0' }}
        </span>
            </div>
          }
        </div>

        <div class="mt-6 pt-5 border-t border-slate-200 flex justify-between items-center">
          <span class="text-lg font-medium text-slate-600">Total amount:</span>
          <span class="text-3xl font-black text-blue-600 tracking-tight transition-all duration-300">
      {{ totalPrice() | currency:'EUR':'symbol':'1.0-0' }}
    </span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
